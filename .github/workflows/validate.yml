name: Validate skill collection

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify actual change scope
        id: scope
        run: |
          python3 skills/software-factory/scripts/check_delivery_receipts.py --base "$BASE_REVISION" --head HEAD --github-output >> "$GITHUB_OUTPUT"
      - name: Validate final delivery receipts
        if: steps.scope.outputs.receipts_only == 'true'
        run: |
          python3 skills/software-factory/scripts/check_delivery_receipts.py --base "$BASE_REVISION" --head HEAD --validate
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.scope.outputs.receipts_only != 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.receipts_only != 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate metadata and links
        if: steps.scope.outputs.receipts_only != 'true'
        run: |
          python3 -m pip install --only-binary=:all: -r scripts/requirements-validation.txt
          python3 scripts/package_plugin.py --check
          python3 scripts/validate_collection.py
          python3 scripts/run_skill_evals.py --check-cases
          python3 evals/check_factory_journey.py
      - name: Run offline helper tests
        if: steps.scope.outputs.receipts_only != 'true'
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s skills/penta-pro/scripts/tests -v
          python3 -m unittest discover -s skills/ui-design-web/scripts/tests -v
          python3 -m unittest discover -s skills/pr-quiz/scripts/tests -v
          node skills/pr-quiz/scripts/tests/workflow.cjs
          node --test scripts/tests/test_agents_log.mjs
          node --test scripts/tests/test_opencode_plugin.mjs
      - name: Check changed lines for whitespace errors
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_REVISION" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_REVISION^{commit}" 2>/dev/null; then
            git diff --check "$BASE_REVISION" HEAD --
          else
            git show --format= --check HEAD --
          fi
